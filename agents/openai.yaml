interface:
  display_name: "LuzCrawl"
  short_description: "用真实浏览器搜索、采集并保存网页证据"
  icon_small: "./assets/icon-400.png"
  icon_large: "./assets/logo.png"
  brand_color: "#8FB396"
  default_prompt: "使用 $luz-crawl 搜索或采集网页：先 doctor，再用 begin 建立输出目录和 experience 查看路线；之后所有命令使用同一个 --out，按 SKILL.md 处理搜索、登录、验证和结果状态。"
policy:
  allow_implicit_invocation: true
